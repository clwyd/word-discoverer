<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f7fb;
            --surface: #ffffff;
            --surface-strong: #eef3f8;
            --text: #16202a;
            --muted: #627084;
            --line: #d8e0ea;
            --accent: #117c73;
            --accent-strong: #0b5f59;
        }
        * {
            box-sizing: border-box;
        }
        body {
            min-width: 340px;
            max-width: 340px;
            margin: 0;
            padding: 10px;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
        fieldset {
            background: var(--surface);
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            margin: 0;
        }
        button {
            min-height: 34px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover {
            background: var(--surface-strong);
        }
        .rateButton {
            width: 44px;
            padding: 0 6px;
            margin: 4px 2px;
        }
        .helpButton {
            width: 40px;
            padding: 0;
            margin: 4px 2px;
            float: right;
        }
        .margin_bottom {
            margin-bottom: 10px !important;
        }
    .display_block {
        display: block !important;
    }
        .vocabButton {
            width: 100%;
            min-height: 34px;
            padding: 0 12px;
            margin: 4px 2px;
        }
        .vocabButton:hover {
            background: var(--surface-strong);
        }
        .addButton {
            width: 34px;
            height: 34px;
            padding: 0;
            margin: 4px 0 0 6px;
            vertical-align: top;
        }
        .addButton img {
            width: 16px;
            height: 16px;
        }
        .indicator {
            color: var(--accent);
            font-weight: 700;
        }
        #rateIndicator2 {
            display: inline-block;
            width: 52px;
            font-size: 16px;
            color: var(--accent);
            font-weight: 700;
            text-align: center;
        }
        .rateInfo {
            font-size: 14px;
            margin: 4px 2px;
            color: var(--muted);
            line-height: 1.4;
        }
        input[type=text] {
            font-size: 14px;
            box-sizing: border-box;
            height: 34px;
            width: calc(100% - 44px);
            margin: 4px 2px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
            padding: 0 10px;
        }
        .rangeLabel {
            background-color: var(--surface-strong);
            display: inline-block;
            width: 80px;
            padding: 2px;
            text-align: center;
            vertical-align: middle;
            color: var(--text);
        }
    .middleCentered {
        height: 50px;
        vertical-align: middle;
        display: table-cell;
    }
        .warningLabel{
            color: #b42318;
            padding: 2px;
            text-align: center;
            font-weight: 700;
        }
        .cbLabel {
            font-size: 14px;
            color: var(--text);
            line-height: 1.5;
        }
        #add_to_list_group {
            margin-top: 10px;
            margin-left: 0;
        }

        .pageCentered {
            width: 200px;
            position: fixed;
            left: 50%;
            margin-left: -100px;
            background-color: var(--surface-strong);
            color: var(--text);
            padding: 2px;
            text-align: center;
            vertical-align: middle;
    }
    </style>
    <title>__MSG_appName__</title>
    <script src="common_lib.js"></script>
    <script src="popup.js"></script>
  </head>
  <body>
    <fieldset>
    <input type="radio" id="rb_enabled" name="switch_mode" value="rb_enabled">
    <label class="cbLabel" for="rb_enabled">__MSG_enabledDescription__</label><br>
    <input type="radio" id="rb_disabled" name="switch_mode" value="rb_disabled">
    <label class="cbLabel" for="rb_disabled">__MSG_disabledDescription__</label><br>
    <div id="add_to_list_group">
    <input type="checkbox" id="addToList">
    <span class="cbLabel">
      <span>__MSG_addVerb__ "</span><span id="addHostName"></span><span>" __MSG_toVerb__ </span><a href="example.com" target="_blank" id="addToListLabel"></a>
    </span>
    </div>
    <br>
    </fieldset>
    <br>
    <fieldset>
    <div class="rateInfo">__MSG_rateInfo1__ <span class="indicator" id="countIndicator">n/a</span> (<span class="indicator" id="rateIndicator1">n/a</span>) __MSG_rateInfo2__</div>
    <button class="rateButton" id="rateM10">-10</button>
    <button class="rateButton" id="rateM1">-1</button>
    <div style="display: inline-block" id="rateIndicator2">n/a</div>
    <button class="rateButton" id="rateP1">+1</button>
    <button class="rateButton" id="rateP10">+10</button>
    </fieldset>
    <br>
    <fieldset>
    <div class="rateInfo">__MSG_vocabSizeInfo1__ <span class="indicator" id="vocabIndicator">n/a</span> __MSG_vocabSizeInfo2__</div>
    <button class="vocabButton margin_bottom display_block" id="showVocab">__MSG_showVocab__</button>
    <span class="rateInfo">__MSG_tipInfo__</span>
    <br>
    <input type="text" id="addText"><button class="addButton" id="addWord"><img src="add.png"></button>
    <br>
    <span class="rateInfo" id="addOpResult"></span>
    </fieldset>
    <br>
    <fieldset>
    <button class="vocabButton" id="adjust">__MSG_adjust__</button>
    <button class="helpButton" id="getHelp">?</button>
    </fieldset>
  </body>
</html>
