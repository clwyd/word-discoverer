<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --surface: #ffffff;
        --surface-strong: #eef3f8;
        --text: #16202a;
        --muted: #627084;
        --line: #d8e0ea;
        --accent: #117c73;
        --accent-strong: #0b5f59;
        --danger: #b42318;
    }
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        font-size: 14px;
    }
    .page {
        width: min(1080px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 24px 0 36px;
    }
    .topbar {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 16px;
        margin-bottom: 16px;
    }
    h1 {
        margin: 0 0 4px;
        font-size: 26px;
        line-height: 1.2;
        font-weight: 700;
    }
    .count {
        color: var(--muted);
        font-size: 13px;
    }
    .toolbar {
        display: grid;
        grid-template-columns: 160px auto minmax(220px, 1fr) 180px auto auto;
        gap: 8px;
        align-items: center;
        margin-bottom: 16px;
    }
    input,
    select,
    button {
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
    }
    input,
    select {
        padding: 0 10px;
    }
    input[type="file"] {
        display: none;
    }
    button {
        padding: 0 12px;
        cursor: pointer;
        font-weight: 600;
    }
    button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: white;
    }
    button.primary:hover {
        background: var(--accent-strong);
    }
    button.danger {
        border-color: #f2c8c4;
        color: var(--danger);
    }
    .list {
        display: grid;
        gap: 8px;
    }
    .entry {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        overflow: hidden;
    }
    .entry[open] {
        border-color: #9dc8c4;
    }
    summary {
        display: grid;
        grid-template-columns: minmax(140px, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 12px 14px;
        cursor: pointer;
        list-style: none;
    }
    summary::-webkit-details-marker {
        display: none;
    }
    .word {
        font-size: 18px;
        font-weight: 700;
        overflow-wrap: anywhere;
    }
    .meta {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: flex-end;
    }
    .chip {
        border-radius: 999px;
        background: var(--surface-strong);
        color: var(--muted);
        padding: 3px 8px;
        font-size: 12px;
        line-height: 1.3;
        white-space: nowrap;
    }
    .entryBody {
        border-top: 1px solid var(--line);
        padding: 12px 14px 14px;
    }
    .facts {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 12px;
    }
    .fact {
        background: var(--surface-strong);
        border-radius: 6px;
        padding: 8px;
        min-width: 0;
    }
    .factLabel {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 4px;
    }
    .factValue {
        overflow-wrap: anywhere;
        font-weight: 600;
    }
    .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }
    .vocabDefinitionPanel {
        margin-top: 12px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface-strong);
        line-height: 1.45;
    }
    .wdDefinitionPhonetic,
    .wdDefinitionPart,
    .wdDefinitionText,
    .wdDefinitionExample,
    .wdDefinitionSynonyms,
    .wdDefinitionEmpty {
        margin-bottom: 6px;
    }
    .wdDefinitionToolbar {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        margin-bottom: 8px;
    }
    .wdDefinitionIcon {
        width: 28px;
        height: 28px;
        padding: 0;
        background: var(--surface);
    }
    .wdDefinitionRefresh::before {
        content: "\21bb";
    }
    .wdDefinitionPopup::before {
        content: "\2197";
    }
    .wdDefinitionPart {
        color: var(--accent-strong);
        font-weight: 700;
    }
    .wdDefinitionExample,
    .wdDefinitionSynonyms,
    .wdDefinitionPhonetic,
    .wdDefinitionEmpty {
        color: var(--muted);
    }
    .empty {
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 24px;
        color: var(--muted);
        background: var(--surface);
        text-align: center;
    }
    @media (max-width: 720px) {
        .topbar {
            align-items: flex-start;
            flex-direction: column;
        }
        .toolbar {
            grid-template-columns: 1fr;
        }
        summary {
            grid-template-columns: 1fr;
        }
        .meta {
            justify-content: flex-start;
        }
        .facts {
            grid-template-columns: 1fr;
        }
    }
</style>
<title data-i18n="vocabularyPageTitle">Your Vocabulary</title>
<script src="common_lib.js"></script>
<script src="context_menu_lib.js"></script>
<script src="FileSaver.js"></script>
<script src="black_white.js"></script>
</head>
<body>
<main class="page" data-list-name="wd_learning_vocabulary">
    <div class="topbar">
        <div>
            <h1 data-i18n="vocabularyPageTitle">Your Vocabulary</h1>
        </div>
    </div>
    <div class="toolbar">
        <select id="listMode">
            <option value="wd_learning_vocabulary" data-i18n="vocabLearning">Learning</option>
            <option value="wd_user_vocabulary" data-i18n="vocabKnown">Known</option>
        </select>
        <span class="count" id="entryCount"></span>
        <input type="search" id="listSearch" data-i18n-placeholder="vocabSearchPlaceholder" placeholder="Search vocabulary">
        <select id="sortMode">
            <option value="alpha" data-i18n="vocabSortAlpha">A-Z</option>
            <option value="frequency" data-i18n="vocabSortFrequency">Frequency</option>
            <option value="kind" data-i18n="vocabSortKind">Type</option>
        </select>
        <button id="exportVocab" data-i18n="vocabExport">Export</button>
        <button id="importVocab" class="primary" data-i18n="vocabImport">Import</button>
        <input id="importVocabFile" type="file">
    </div>
    <div id="vocabularySection" class="list"></div>
</main>
</body>
</html>
